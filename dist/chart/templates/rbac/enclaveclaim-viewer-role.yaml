{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "enclave.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "enclave.resourceName" (dict "suffix" "enclaveclaim-viewer-role" "context" $) }}
rules:
- apiGroups:
  - enclave.unmango.dev
  resources:
  - enclaveclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - enclave.unmango.dev
  resources:
  - enclaveclaims/status
  verbs:
  - get
{{- end }}
