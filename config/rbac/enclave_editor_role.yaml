# This rule is not used by the project enclave itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the enclave.unmango.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: enclave
    app.kubernetes.io/managed-by: kustomize
  name: enclave-editor-role
rules:
- apiGroups:
  - enclave.unmango.dev
  resources:
  - enclaves
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - enclave.unmango.dev
  resources:
  - enclaves/status
  verbs:
  - get
